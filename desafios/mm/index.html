<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameIA - Especialista em Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="logologo.jpg" width="500" alt="GameIA Logo">
        <h2>Especialista em Jogos</h2>
        <p>Responda e descubra o jogo ideal para você.</p>
        
        <form action="processa.php" method="POST">
            <div class="form-group">
                <label>Qual sua plataforma preferida?</label>
                <select name="plataforma" required>
                    <option value="">Selecione...</option>
                    <option value="PC">PC</option>
                    <option value="Console">Console (PlayStation / Xbox / Switch)</option>
                    <option value="Celular">Celular (Mobile)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Qual gênero você prefere?</label>
                <select name="genero" required>
                    <option value="">Selecione...</option>
                    <option value="Ação">Ação / Aventura</option>
                    <option value="RPG">RPG</option>
                    <option value="Estratégia">Estratégia</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quanto tempo você prefere jogar?</label>
                <select name="tamanho" required>
                    <option value="">Selecione...</option>
                    <option value="Curtas">Partidas curtas e rápidas</option>
                    <option value="Longas">Campanhas longas e imersivas</option>
                </select>
            </div>

            <button type="submit">Recomendar</button>
        </form>
    </div>
</body>
</html>
